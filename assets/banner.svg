<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0c1228" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Styles and Animations -->
    <style>
      .glow-pulse {
        animation: pulseGlow 6s ease-in-out infinite alternate;
      }
      .float-slow {
        animation: floatSlow 5s ease-in-out infinite alternate;
      }
      .float-mid {
        animation: floatMid 4.2s ease-in-out infinite alternate;
      }
      .float-rev {
        animation: floatRev 4.8s ease-in-out infinite alternate;
      }
      .shimmer-pulse {
        animation: shimmer 3s linear infinite;
      }
      .star-blink-1 {
        animation: starBlink 2.5s ease-in-out infinite alternate;
      }
      .star-blink-2 {
        animation: starBlink 3.5s ease-in-out infinite alternate;
      }

      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(0.98); }
        100% { opacity: 0.85; transform: scale(1.02); }
      }

      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(0.8deg); }
      }

      @keyframes floatMid {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(10px) rotate(-1deg); }
      }

      @keyframes floatRev {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-8px) rotate(-0.6deg); }
      }

      @keyframes starBlink {
        0% { opacity: 0.2; transform: scale(0.7); }
        100% { opacity: 0.95; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Pulsing Glow Orbs (Dynamic Background) -->
  <circle cx="240" cy="140" r="280" fill="url(#glowPurple)" class="glow-pulse" />
  <circle cx="980" cy="280" r="300" fill="url(#glowCyan)" class="glow-pulse" />
  <circle cx="600" cy="210" r="320" fill="url(#glowIndigo)" class="glow-pulse" />

  <!-- Decorative Grid Mesh Lines (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />

    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Shimmering Star Particles (Dynamic Accent) -->
  <circle cx="160" cy="90" r="2.5" fill="#a5b4fc" class="star-blink-1" />
  <circle cx="340" cy="60" r="2" fill="#38bdf8" class="star-blink-2" />
  <circle cx="1060" cy="110" r="3" fill="#c084fc" class="star-blink-1" />
  <circle cx="920" cy="80" r="2" fill="#818cf8" class="star-blink-2" />
  <circle cx="1110" cy="320" r="2.5" fill="#38bdf8" class="star-blink-1" />
  <circle cx="140" cy="330" r="2" fill="#a5b4fc" class="star-blink-2" />

  <!-- Dynamic Floating Feature Pills (Positioned safely on outer flanks) -->
  <!-- Top Left Pill -->
  <g class="float-slow" transform="translate(60, 60)" filter="url(#badgeShadow)">
    <rect width="190" height="42" rx="21" fill="url(#pillGrad)" stroke="url(#pillBorder)" stroke-width="1.2" />
    <circle cx="22" cy="21" r="6" fill="#38bdf8" />
    <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Astro &amp; SvelteKit</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="float-rev" transform="translate(65, 310)" filter="url(#badgeShadow)">
    <rect width="200" height="42" rx="21" fill="url(#pillGrad)" stroke="url(#pillBorder)" stroke-width="1.2" />
    <circle cx="22" cy="21" r="6" fill="#10b981" />
    <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📦 Self-Hosted &amp; Free</text>
  </g>

  <!-- Top Right Pill -->
  <g class="float-mid" transform="translate(945, 60)" filter="url(#badgeShadow)">
    <rect width="195" height="42" rx="21" fill="url(#pillGrad)" stroke="url(#pillBorder)" stroke-width="1.2" />
    <circle cx="22" cy="21" r="6" fill="#f43f5e" />
    <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎨 Visual No-Code</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="float-slow" transform="translate(940, 310)" filter="url(#badgeShadow)">
    <rect width="200" height="42" rx="21" fill="url(#pillGrad)" stroke="url(#pillBorder)" stroke-width="1.2" />
    <circle cx="22" cy="21" r="6" fill="#a855f7" />
    <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 Bento &amp; Static Web</text>
  </g>

  <!-- FOREGROUND: Content Group (Guaranteed on top of all animated elements) -->
  <g id="foreground-content" transform="translate(600, 0)">

    <!-- Top Badge / Header Tag -->
    <g transform="translate(0, 85)" filter="url(#badgeShadow)">
      <rect x="-190" y="0" width="380" height="34" rx="17" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1" />
      <text x="0" y="22" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">🌟 CURATED ECOSYSTEM &amp; AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="180" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome Portfolio Website Builder
    </text>

    <!-- Subtitle Highlight Bar -->
    <text x="0" y="225" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.2">
      Self-Hosted Builders • Static Site Generators • Design &amp; Developer Portfolios
    </text>

    <!-- Secondary Explanatory Subtitle -->
    <text x="0" y="260" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Curated showcase of SaaS platforms &amp; open-source projects for permanence and 100% data ownership
    </text>

    <!-- Bottom Feature Pill Indicators -->
    <g transform="translate(0, 315)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
        <text x="70" y="20" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚀 20+ OSS Repos</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-70, 0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
        <text x="70" y="20" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 SaaS Ranked</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(90, 0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
        <text x="70" y="20" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 Zero Lock-In</text>
      </g>
    </g>

  </g>

  <!-- Subtle Outer Border with Glow -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5" />
</svg>
